# ==========================================
#         FuryMinions - Config
# ==========================================

# Konfiguracja limitów minionów po permisji
minion-limits:
  default: 5
  vip: 10
  mvp: 15
  admin: 50

# Konfiguracja bazy danych MariaDB
database:
  # URL połączenia JDBC (zmień na swoje ustawienia)
  url: "jdbc:mariadb://localhost:3307/furycraft_minecraft"
  
  # Dane logowania do bazy danych
  username: "furycraft_mc_user"
  password: "furycraft_mc_pass_2026"
  
  # Ustawienia puli połączeń HikariCP
  pool-size: 10          # Maksymalna liczba połączeń w puli
  min-idle: 2            # Minimalna liczba idle połączeń
  connection-timeout: 30000   # Timeout połączenia (ms)
  idle-timeout: 600000       # Timeout dla idle połączeń (ms)
  max-lifetime: 1800000       # Maksymalny czas życia połączenia (ms)

